<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Houcap Petcap — Köpek Şapkası | Disi</title>
<link rel="icon" href="https://disisafety.com/wp-content/uploads/2024/11/cropped-ds-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#e3141b;--org:#e8622a;--navy:#0d1b2e;--page:#2f343c;--bg:#f4f6f9;--mut:#5d6b80;--line:#e3e8ef}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Barlow,system-ui,sans-serif;background:var(--page);color:var(--navy);line-height:1.55}
a{color:inherit;text-decoration:none}img,video{max-width:100%;display:block}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.top{background:#fff;border-bottom:1px solid var(--line)}
.top .wrap{height:84px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.top img{height:62px}
.back{font-weight:700;padding:10px 18px;border-radius:30px;border:1.5px solid var(--line)}
.back:hover{border-color:var(--red);color:var(--red)}
.hero{padding:40px 0}
.box{background:#fff;border-radius:32px;padding:44px;display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
.lg{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.lg img{height:130px}
.lg small{font:800 13px Barlow;letter-spacing:.4em;text-transform:uppercase;color:var(--org);padding-left:6px}
h1{font-size:clamp(32px,3.6vw,48px);line-height:1.05;letter-spacing:-.02em;margin:22px 0 12px}
p{color:var(--mut);font-size:17px}
.cl{display:flex;gap:10px;margin:22px 0 26px;align-items:center;flex-wrap:wrap}
.cl span{display:flex;align-items:center;gap:8px;font-weight:700;padding:8px 14px 8px 8px;border-radius:30px;background:var(--bg)}
.cl i{width:24px;height:24px;border-radius:50%}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:50px;font-weight:700}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--navy)}
.btn-wa{background:#25d366;color:#fff}
.media{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.media img,.media video{width:100%;height:100%;object-fit:cover;border-radius:20px;background:#fff;border:1px solid var(--line)}
.note{margin-top:18px;font-size:13px;background:#fff7e0;color:#7a5b00;border-radius:12px;padding:10px 14px;display:inline-block}
@media(max-width:900px){.box{grid-template-columns:1fr;padding:28px 22px}.lg img{height:100px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a href="v2-b.html"><img src="img/disi-tekstil-logo.png" alt="Disi Tekstil Promosyon"></a><a class="back" href="v2-b.html#markalar">← Ana sayfa</a></div></header>
<section class="hero"><div class="wrap"><div class="box">
  <div>
    <div class="lg"><img src="img/houcap-logo.png" alt="Houcap"><small>petcap</small></div>
    <h1>Köpekler için ayarlanabilir şapka</h1>
    <p>Houcap, Disi'nin evcil hayvan şapkası serisidir. Kayışlı tasarım şapkayı başta sabit tutar; logolu ve özel renkli üretim için bize yazın.</p>
    <div class="cl"><span><i style="background:#f07a1c"></i>Turuncu</span><span><i style="background:#c8102e"></i>Kırmızı</span><span><i style="background:#f5c400"></i>Sarı</span></div>
    <div class="btns"><a class="btn btn-red" href="v2-b.html#teklif">Teklif İste →</a><a class="btn btn-wa" href="https://wa.me/902163084432?text=Merhaba%2C%20Houcap%20k%C3%B6pek%20%C5%9Fapkas%C4%B1%20hakk%C4%B1nda%20bilgi%20almak%20istiyorum." target="_blank" rel="noopener">WhatsApp</a></div>
    <span class="note">Model, beden ve teknik bilgiler firmadan gelince eklenecek.</span>
  </div>
  <div class="media">
    <img src="img/houcap-kopek.jpg" alt="Houcap köpek şapkası — turuncu, kırmızı, sarı">
    <video src="video/houcap.mp4" poster="video/houcap-poster.jpg" muted loop playsinline autoplay></video>
  </div>
</div></div></section>
</body>
</html>
